name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Accept Android licenses (SDK is preinstalled on runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install dependencies
        run: npm install
      - name: Prepare web folder
        run: mkdir -p www && cp index.html privacypolicy.html www/
      - name: Create Android project
        run: npx cap add android
      - name: Patch project (min SDK, signing, icons)
        run: node prepare.js
      - name: Sync web assets and plugins
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk DOR-FIT.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DOR-FIT-apk
          path: DOR-FIT.apk
      - name: Publish release (stable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DOR FIT (APK)
          files: DOR-FIT.apk
          make_latest: true
